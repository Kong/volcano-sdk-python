name: CI

on:
  workflow_call:
  pull_request:
  merge_group:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash .github/scripts/actionlint.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - name: Run SDK quality checks
        env:
          MUTATION_DIFF_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: uv run --locked poe quality
      - name: Preserve runtime coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-for-python-${{ matrix.python-version }}
          path: reports/coverage.json
          if-no-files-found: error
      - name: Preserve mutation outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-for-python-${{ matrix.python-version }}
          path: |
            reports/mutation-targets.txt
            reports/mutation-results.txt
            reports/mutation-summary.json
            mutants/mutmut-cicd-stats.json
          if-no-files-found: error
      - name: Preserve test failures and property seeds
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-failures-python-${{ matrix.python-version }}
          path: |
            reports/unit.xml
            reports/coverage-unit.xml
            reports/hypothesis/seed.txt
          if-no-files-found: ignore

  quality:
    name: Quality Gate
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'length == 1 and all(. == "success")' <<< "$RESULTS"

name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false
  # Retain pending runs for versions that already have a GitHub release.
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "v$(jq -er '.["."]' .release-please-manifest.json)"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only the hash-checked build task may build the project in this job.
      UV_NO_SYNC: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.17"
      - run: uv sync --locked --no-install-project --no-build
      - run: uv run --no-sync poe build
      - name: Check package identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/check_package.sh "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/volcano-sdk-python/
    permissions:
      id-token: write
    steps:
      # Publishing receives checked artifacts without executing SDK source.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-link:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Link the published PyPI version in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          link="[View ${RELEASE_TAG} on PyPI](https://pypi.org/project/volcano-sdk-python/${RELEASE_TAG#v}/)"
          if [[ "$notes" != *"$link"* ]]; then
            printf '%s\n\n%s\n' "$notes" "$link" | gh release edit "$RELEASE_TAG" --notes-file -
          fi

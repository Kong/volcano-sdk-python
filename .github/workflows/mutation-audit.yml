name: Full Mutation Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - name: Mutate every handwritten runtime module
        run: |
          set -euo pipefail
          uv run --locked mutmut run
          uv run --locked mutmut export-cicd-stats
          mkdir -p reports
          uv run --locked mutmut results --all true > reports/mutation-audit-results.txt
          cat mutants/mutmut-cicd-stats.json
      - name: Preserve full mutation outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-mutation-audit
          path: |
            reports/mutation-audit-results.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: error

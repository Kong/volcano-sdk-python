[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volcano-sdk"
version = "0.1.0"
description = "Official Python SDK for Volcano"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Kong", email = "office@konghq.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff]
required-version = "==0.16.4"
target-version = "py311"
output-prefer-rule-codes = true
extend-exclude = ["src/volcano_sdk/_generated"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "ALL",
  "ASYNC119",
  "B901",
  "B909",
  "DOC201",
  "DOC501",
  "D420",
  "PLE4703",
  "PLW0244",
  "PLW0717",
  "PLW1514",
  "PLW3201",
  "PT029",
  "RUF045",
  "RUF066",
  "RUF069",
  "RUF071",
  "RUF074",
  "RUF105",
]
ignore = [
  # The repository license covers source files without per-file headers.
  "CPY001",
  # Ruff format uses the opposite convention or supersedes these rules.
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D213",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC001",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"features/**/*.py" = ["D", "INP001", "S101"]
"scripts/*.py" = ["T201"]
"src/volcano_sdk/auth.py" = ["SLF001"]
"src/volcano_sdk/database.py" = ["SLF001"]
"src/volcano_sdk/durable.py" = ["SLF001"]
"src/volcano_sdk/durable_authoring.py" = ["ANN401"]
"src/volcano_sdk/functions.py" = ["SLF001"]
"src/volcano_sdk/logs.py" = ["SLF001"]
"src/volcano_sdk/locks.py" = ["SLF001"]
"src/volcano_sdk/realtime.py" = ["ANN401", "SLF001"]
"src/volcano_sdk/storage.py" = ["SLF001"]
"tests/**/*.py" = [
  "ANN401",
  "D",
  "INP001",
  "PLR2004",
  "S101",
  "S105",
  "S106",
  "SLF001",
]

[tool.pytest.ini_options]
minversion = "9.1.1"
pythonpath = [".", "features"]
strict = true
empty_parameter_set_mark = "fail_at_collect"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
asyncio_debug = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_dirs = ["src/volcano_sdk"]
omit = ["src/volcano_sdk/_generated/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
include_namespace_packages = true
# Keep declaration-only exclusions; coverage-ignore comments have no effect.
exclude_lines = [
  '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
  'if (typing\.)?TYPE_CHECKING:',
]
partial_branches = []

[tool.mutmut]
source_paths = ["src/volcano_sdk"]
type_check_command = [
  "pyrefly", "check", "--output-format=json",
  "src/volcano_sdk/realtime.py",
  "src/volcano_sdk/auth.py",
  "src/volcano_sdk/storage.py",
  "src/volcano_sdk/functions.py",
  "src/volcano_sdk/database.py",
  "src/volcano_sdk/_function_resolution.py",
  "src/volcano_sdk/_transport.py",
  "src/volcano_sdk/_session.py",
  "src/volcano_sdk/_session_operations.py",
]
cache_invalidation_files = ["tests/**/*.py"]
pytest_add_cli_args_test_selection = ["tests/unit"]
pytest_add_cli_args = ["-c", "pyproject.toml", "-x"]
do_not_mutate = ["src/volcano_sdk/_generated/*"]
on_dependency_change = "rerun"
process_isolation = "forkserver"
also_copy = [
  "features",
  "maintainers",
  "tests/fixtures",
  "scripts",
  "openapi",
  "openapi-python-client.yaml",
  "README.md",
]

[tool.poe.tasks]
quality = ["checks", "mutation"]
checks = ["policy", "audit", "generated", "lint", "format-check", "types", "test", "coverage", "contract-check", "package-check", "package-extras"]
policy = "bash scripts/check_quality_policy.sh"
build = "uv build --no-sources --require-hashes"
audit = "bash scripts/audit_dependencies.sh"
generated = "python -m scripts.check_openapi"
lint = "ruff check --config pyproject.toml ."
format-check = "ruff format --check --config pyproject.toml ."
types = ["mypy", "basedpyright"]
mypy = "mypy --config-file pyproject.toml"
basedpyright = "basedpyright --project pyproject.toml"
mutation = "bash scripts/mutation.sh"
mutation-full = "MUTATION_FULL=1 bash scripts/mutation.sh"

[tool.poe.tasks.test]
interpreter = "bash"
shell = """
set -euo pipefail
report_dir="$(mktemp -d)"
trap 'rm -rf "$report_dir"' EXIT
test_status=0
pytest -c pyproject.toml tests/unit -q --junitxml="$report_dir/unit.xml" || test_status=$?
mkdir -p reports
if test -s "$report_dir/unit.xml"; then
  mv "$report_dir/unit.xml" reports/unit.xml
else
  echo 'pytest did not write a JUnit report' >&2
  if [[ $test_status -eq 0 ]]; then test_status=1; fi
fi
exit "$test_status"
"""

[tool.poe.tasks.coverage]
interpreter = "bash"
shell = """
set -euo pipefail
report_dir="$(mktemp -d)"
trap 'rm -rf "$report_dir"' EXIT
test_status=0
uv run --locked --isolated --python 3.12 pytest -c pyproject.toml tests/unit -q --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=json:"$report_dir/coverage.json" --junitxml="$report_dir/unit.xml" || test_status=$?
mkdir -p reports
if test -s "$report_dir/coverage.json"; then
  mv "$report_dir/coverage.json" reports/coverage.json
else
  echo 'pytest-cov did not write a coverage report' >&2
  if [[ $test_status -eq 0 ]]; then test_status=1; fi
fi
if test -s "$report_dir/unit.xml"; then
  mv "$report_dir/unit.xml" reports/coverage-unit.xml
else
  echo 'pytest did not write a JUnit report' >&2
  if [[ $test_status -eq 0 ]]; then test_status=1; fi
fi
exit "$test_status"
"""

[tool.poe.tasks.contract-check]
sequence = [
  { cmd = "chmod 600 tests/fixtures/sdk-contract-dry-run.json" },
  { cmd = "behave features/contract --dry-run --no-snippets" },
]
env.VOLCANO_SDK_CONTRACT_FIXTURE = "${POE_ROOT}/tests/fixtures/sdk-contract-dry-run.json"

[tool.poe.tasks.package-check]
# Keep artifacts private to this run and remove them even when validation fails.
interpreter = "bash"
shell = """
set -euo pipefail
package_dir="$(mktemp -d)"
trap 'rm -rf "$package_dir"' EXIT
poe build --out-dir "$package_dir"
bash scripts/check_package.sh "" "$package_dir"
"""

[tool.poe.tasks.package-extras]
cmd = "tox run -c pyproject.toml --recreate -e package-base,package-min-typing,package-durable,package-types"

[tool.tox]
env_list = ["package-base", "package-min-typing", "package-durable", "package-types"]

[tool.tox.env_run_base]
package = "wheel"
commands = [["python", "-I", "tests/package/optional_dependency.py", "base"]]

[tool.tox.env.package-min-typing]
deps = ["typing-extensions==4.10.0"]
constrain_package_deps = true
commands = [["python", "-I", "-c", "from importlib.metadata import version; assert version('typing-extensions') == '4.10.0'; import volcano_sdk"]]

[tool.tox.env.package-durable]
extras = ["durable"]
commands = [["python", "-I", "tests/package/optional_dependency.py", "durable"]]

[tool.tox.env.package-types]
extras = ["durable"]
deps = ["basedpyright==1.40.1"]
change_dir = "{env_tmp_dir}"
commands = [
  ["basedpyright", "--project", "{env_tmp_dir}", "--verifytypes", "volcano_sdk", "--warnings"],
]

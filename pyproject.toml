[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volcano-sdk"
version = "0.1.0"
description = "Official Python SDK for Volcano"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Kong", email = "office@konghq.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "attrs>=26.1.0",
  "centrifuge-python>=0.6.0,<0.7.0",
  "httpx>=0.28.1,<0.29.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
  "behave>=1.3.3,<2.0.0",
  "build>=1.5.0,<2.0.0",
  "mypy>=1.18.0",
  "openapi-python-client==0.29.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  "types-python-dateutil>=2.9.0.20250822",
]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
exclude = ["src/volcano_sdk/_generated/"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/volcano_sdk/_generated"]

[tool.ruff.lint]
extend-select = ["I"]
